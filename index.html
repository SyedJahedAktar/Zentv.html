<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTube - @twzeno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --card-hover: #252525;
      --text: #f1f1f1;
      --text-muted: #aaa;
      --primary: #3ea6ff;
      --border: #303030;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }
    header { 
      background: rgba(15,15,15,0.9); 
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0; 
      position: sticky; top: 0; z-index: 100; 
    }
   .container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; }
   .nav { display: flex; align-items: center; justify-content: space-between; }
   .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(45deg, #ff0000, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
   .tabs { display: flex; gap: 0.5rem; margin: 2rem 0 1.5rem; }
   .tab { 
      padding: 0.6rem 1.2rem; 
      background: var(--card); 
      border: 1px solid var(--border);
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 500;
      transition: all 0.2s;
    }
   .tab:hover { background: var(--card-hover); }
   .tab.active { background: var(--primary); color: #000; border-color: var(--primary); }
   .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 1.5rem; 
      margin-bottom: 3rem;
    }
   .card { 
      background: var(--card); 
      border-radius: 16px; 
      overflow: hidden; 
      cursor: pointer; 
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
   .card:hover { 
      transform: translateY(-4px); 
      background: var(--card-hover);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
   .thumbnail { position: relative; }
   .thumbnail img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
   .duration { 
      position: absolute; bottom: 8px; right: 8px; 
      background: rgba(0,0,0,0.8); padding: 2px 6px; 
      border-radius: 4px; font-size: 0.75rem; font-weight: 500;
    }
   .live-badge { 
      position: absolute; top: 8px; left: 8px; 
      background: #ff0000; padding: 2px 8px; 
      border-radius: 4px; font-size: 0.7rem; font-weight: 700;
    }
   .card-body { padding: 1rem; }
   .card-title { 
      font-size: 0.95rem; font-weight: 600; 
      line-height: 1.4; margin-bottom: 0.5rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
   .card-meta { font-size: 0.85rem; color: var(--text-muted); }
   .pagination { 
      display: flex; gap: 0.5rem; justify-content: center; 
      align-items: center; margin: 3rem 0; flex-wrap: wrap;
    }
   .page-btn { 
      min-width: 40px; height: 40px;
      padding: 0 0.75rem; 
      background: var(--card); 
      border: 1px solid var(--border); 
      color: var(--text); 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 500;
      transition: all 0.2s;
    }
   .page-btn:hover:not(:disabled) { background: var(--card-hover); border-color: #555; }
   .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
   .page-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
   .loader { 
      text-align: center; padding: 4rem 0; 
      color: var(--text-muted); font-weight: 500;
    }
   .adsense-slot { 
      width: 100%; min-height: 90px; 
      background: var(--card); border: 1px dashed var(--border);
      border-radius: 12px; margin: 2rem 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.85rem;
    }
   @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding: 0 1rem; }
      .tabs { overflow-x: auto; padding-bottom: 0.5rem; }
    }
  </style>
</head>

  <header>
    <div class="container">
      <div class="nav">
        <div class="logo">ZenTube</div>
      </div>
    </div>
  </header>

      <div class="tab active" data-type="video">Videos</div>

    <div id="grid" class="grid"></div>

    <!-- AdSense Slot 2: Above pagination -->
    <div class="adsense-slot">AdSense In-Article</div>

    <div id="pagination" class="pagination"></div>
  </div>
